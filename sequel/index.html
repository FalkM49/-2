<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Иллюзии Мистерио</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Rubik+Mono+One&family=Rubik:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0b0a18;
    --panel: #171330;
    --line: #2e2860;
    --text: #efe9ff;
    --muted: #a69ed2;
    --red: #e02a3c;
    --blue: #2350b5;
    --mist: #5ff2a8;
    --violet: #8a4fd6;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font: 15px/1.5 Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 {
    font-family: "Rubik Mono One", Rubik, system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 3vw, 25px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  h1 .m { color: var(--mist); }
  .tools { display: flex; gap: 8px; }
  .tool {
    font: 600 13px/1 Rubik, system-ui, sans-serif;
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tool:hover { border-color: var(--muted); }
  .tool:focus-visible, .btn:focus-visible { outline: 3px solid var(--mist); outline-offset: 2px; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 3px solid #000;
    box-shadow: 6px 6px 0 var(--violet);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dpad { display: flex; gap: 10px; }
  .acts { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }
  .btn {
    font: 600 12px/1 Rubik, system-ui, sans-serif;
    letter-spacing: .04em;
    color: #fff;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    min-width: 64px;
    height: 56px;
    padding-inline: 10px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.arrow { font-size: 22px; min-width: 60px; }
  .btn.jump { background: var(--blue); border-color: #3c6bd6; }
  .btn.punch { background: var(--red); border-color: #ff5a68; }
  .btn.web { background: #e8e4f6; color: #16122e; border-color: #fff; }
  .btn.swing { background: #3b2f78; border-color: #5a4ab0; }
  .btn.on { transform: translateY(2px); filter: brightness(1.25); }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13px; }
  .keys span { white-space: nowrap; }
  kbd {
    font: 600 12px/1 Rubik, system-ui, sans-serif;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom-width: 3px;
    border-radius: 5px;
    padding: 3px 6px;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0; max-width: 70ch; }
  @media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
  @media (max-width: 420px) { .btn { min-width: 56px; height: 50px; font-size: 11px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Человек-паук 2 · <span class="m">Иллюзии Мистерио</span></h1>
    <div class="tools">
      <button class="tool" id="muteBtn" type="button">Звук: вкл</button>
      <button class="tool" id="pauseBtn" type="button">Пауза</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="960" height="540" aria-label="Игровое поле"></canvas>
  </div>

  <div class="pad">
    <div class="dpad">
      <button class="btn arrow" type="button" data-act="left" aria-label="Влево">◀</button>
      <button class="btn arrow" type="button" data-act="right" aria-label="Вправо">▶</button>
    </div>
    <div class="acts">
      <button class="btn swing" type="button" data-act="swing">ЛИАНА</button>
      <button class="btn jump" type="button" data-act="jump">ПРЫЖОК</button>
      <button class="btn web" type="button" data-act="web">ПАУТИНА</button>
      <button class="btn punch" type="button" data-act="punch">УДАР</button>
    </div>
  </div>

  <div class="keys">
    <span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> бег</span>
    <span><kbd>↑</kbd> / <kbd>W</kbd> / <kbd>Пробел</kbd> прыжок</span>
    <span><kbd>J</kbd> удар</span>
    <span><kbd>K</kbd> паутина</span>
    <span><kbd>L</kbd> / <kbd>Shift</kbd> держать — качнуться</span>
    <span><kbd>Enter</kbd> дальше</span>
    <span><kbd>P</kbd> пауза</span>
    <span><kbd>M</kbd> звук</span>
  </div>
  <p class="note">Барьер из тумана не пропустит дальше, пока на участке остаётся хоть один враг. Прогресс сохраняется в начале каждого акта.</p>
</div>

<script>
(() => {
'use strict';

// ============================================================ setup
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
let DPR = 1;
function fit() { DPR = Math.min(window.devicePixelRatio || 1, 2); cv.width = W * DPR; cv.height = H * DPR; }
fit();
addEventListener('resize', fit);

const F_DISP = '"Rubik Mono One", Rubik, system-ui, sans-serif';
const F_TALK = 'Neucha, "Comic Sans MS", Rubik, cursive';
const F_UI = 'Rubik, system-ui, sans-serif';
const RED = '#d7263d', BLUE = '#2350b5', DARKBLUE = '#173a8a';
const MIST = '#5ff2a8';
const SPIDEY_PAL = { r: RED, b: BLUE, db: DARKBLUE };
const PHANTOM_PAL = { r: '#7b3fc4', b: '#17866a', db: '#0f5a47' };

function rng(seed) { let s = seed >>> 0; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
function hash(a, b) {
  let n = Math.imul(a, 374761393) + Math.imul(b, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pick = arr => arr[(Math.random() * arr.length) | 0];
const COARSE = matchMedia('(pointer: coarse)').matches;

// ============================================================ save (per-viewer convenience)
function loadSave() { try { return JSON.parse(localStorage.getItem('mysterio-save') || 'null'); } catch (e) { return null; } }
function writeSave(act) { try { localStorage.setItem('mysterio-save', JSON.stringify({ act })); } catch (e) {} }
function clearSave() { try { localStorage.removeItem('mysterio-save'); } catch (e) {} }

// ============================================================ audio
let AC = null, muted = false;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function tone(f, d, type = 'square', v = .08, slide = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
function noise(d, v = .15) {
  if (!AC || muted) return;
  const b = AC.createBuffer(1, Math.max(1, AC.sampleRate * d | 0), AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = b; g.gain.value = v; s.connect(g).connect(AC.destination); s.start();
}
const later = (ms, fn) => setTimeout(fn, ms);
const SFX = {
  jump: () => tone(380, .12, 'square', .04, 300),
  punch: () => noise(.06, .08),
  web: () => tone(1100, .14, 'sawtooth', .025, -800),
  hit: () => { noise(.12, .2); tone(130, .14, 'square', .07, -60); },
  clank: () => { tone(1500, .12, 'square', .05, -300); tone(900, .18, 'triangle', .05); },
  hurt: () => tone(320, .3, 'sawtooth', .06, -230),
  boom: () => { noise(.5, .28); tone(90, .45, 'sine', .22, -50); },
  shot: () => noise(.05, .12),
  orb: () => tone(500, .2, 'sine', .05, 400),
  poof: () => { noise(.2, .1); tone(700, .2, 'sine', .04, -500); },
  laugh: () => [0, 1, 2, 3].forEach(i => later(i * 130, () => tone(560 - i * 30, .1, 'square', .045, 140))),
  myst: () => [0, 1, 2].forEach(i => later(i * 160, () => tone(220 + i * 110, .3, 'triangle', .05, 60))),
  pick: () => { tone(660, .08, 'square', .05); later(80, () => tone(990, .12, 'square', .05)); },
  meow: () => tone(620, .4, 'triangle', .08, 480),
  zap: () => { tone(1800, .15, 'sawtooth', .04, -1500); noise(.1, .08); },
  open: () => [392, 523, 659].forEach((f, i) => later(i * 90, () => tone(f, .16, 'triangle', .06))),
  blip: () => tone(1300, .02, 'square', .012),
  slam: () => { noise(.35, .3); tone(60, .4, 'sine', .25, -20); },
  beam: () => tone(180, .9, 'sawtooth', .03, 120),
  heart: () => [659, 784, 988, 1318].forEach((f, i) => later(i * 180, () => tone(f, .35, 'triangle', .05))),
};

// ============================================================ input
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  KeyJ: 'punch', KeyX: 'punch', KeyK: 'web', KeyC: 'web',
  KeyL: 'swing', ShiftLeft: 'swing', ShiftRight: 'swing', KeyV: 'swing',
  Enter: 'ok', NumpadEnter: 'ok', KeyP: 'pause', Escape: 'pause', KeyM: 'mute',
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); ensureAudio();
  if (!keys[a]) pressed[a] = true;
  keys[a] = true;
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) keys[a] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('[data-act]').forEach(b => {
  const a = b.dataset.act;
  const down = e => {
    e.preventDefault(); ensureAudio();
    if (!keys[a]) pressed[a] = true;
    keys[a] = true; b.classList.add('on');
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const up = () => { keys[a] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', () => { ensureAudio(); pressed.ok = true; });
const muteBtn = document.getElementById('muteBtn');
function syncMute() { muteBtn.textContent = muted ? 'Звук: выкл' : 'Звук: вкл'; }
muteBtn.addEventListener('click', () => { ensureAudio(); muted = !muted; syncMute(); });
document.getElementById('pauseBtn').addEventListener('click', () => { pressed.pause = true; });

// ============================================================ story
const WHO = {
  spidey: { name: 'ЧЕЛОВЕК-ПАУК', bg: '#c81f33', fg: '#fff' },
  cat: { name: 'ЧЁРНАЯ КОШКА', bg: '#15131c', fg: '#fff' },
  catv: { name: 'ГОЛОС КОШКИ', bg: '#2a2340', fg: '#e8e4f6', face: 'cat' },
  fcat: { name: 'КОШКА?..', bg: '#1f4a3a', fg: MIST, face: 'cat' },
  goblin: { name: 'ПРИЗРАК ГОБЛИНА', bg: '#3a2a5a', fg: '#b8ff7a' },
  myst: { name: 'МИСТЕРИО', bg: '#3b1f5e', fg: MIST },
  narr: { name: '', bg: '#ffd84a' },
};
const L = (s, t) => ({ s, t });

const DATE_1 = [
  L('narr', 'Две недели после победы над Гоблином. Та же крыша, та же луна. Только в этот раз Паук пришёл не драться.'),
  L('cat', 'Ты опоздал на семь минут, паучок. Я уже решила, что ты меня боишься.'),
  L('spidey', 'Застрял с грабителем банкомата. Он очень не хотел в участок.'),
  L('cat', 'Садись рядом. Отсюда лучший вид в городе. И я сейчас не про небоскрёбы.'),
  L('cat', 'У меня для тебя подарок.'),
  L('narr', 'Она кладёт ему на ладонь бриллиант «Полночь». Тот самый, из-за которого всё началось.'),
  L('spidey', 'Ты... отдаёшь его? Фелиция, ты не заболела?'),
  L('cat', 'Верни его в музей сам. Скажешь, что поймал меня. Мне нравится, когда ты мной гордишься.'),
  L('spidey', 'Знаешь... мне правда хорошо с тобой. Даже когда ты воруешь.'),
  L('cat', 'Особенно когда я ворую, милый.'),
  L('narr', 'Она наклоняется ближе. Ещё ближе. И тут город заливает зелёный туман.'),
];
const DATE_2 = [
  L('myst', 'ДАМЫ И ГОСПОДА! Прошу прощения, что прерываю это трогательное шоу!'),
  L('myst', 'Я — МИСТЕРИО! Этой ночью Нью-Йорк станет моей сценой, а вы все — моими зрителями!'),
  L('cat', 'Паук... я не чувствую ног... этот туман...'),
  L('narr', 'Туман сворачивается в светящийся пузырь и уносит Кошку в сторону Таймс-сквер.'),
  L('myst', 'Какая очаровательная ассистентка! Хочешь её вернуть? Досмотри моё представление. Все три акта!'),
  L('spidey', 'Первое нормальное свидание за год. И его сорвал мужик с аквариумом на голове.'),
  L('spidey', 'Держись, Фелиция. Я иду.'),
];
const L1_START = [
  L('myst', 'Акт первый! Мой туман накрыл Таймс-сквер. Мои дроны видят каждое твоё движение!'),
  L('spidey', 'Барьеры из тумана, значит. Ладно, сначала расчищу крыши, потом пройду дальше.'),
];
const L1_S2 = [
  L('catv', 'Паучок... если ты меня слышишь... не верь тому, что увидишь. Он залезает в голову.'),
  L('spidey', 'Слышу! Держись, я уже близко!'),
  L('myst', 'Как трогательно. Зрители в зале уже достают платочки.'),
];
const L1_S3 = [
  L('myst', 'Знаешь, в чём секрет хорошего фокуса, паучок? Зритель смотрит туда, куда я скажу.'),
  L('spidey', 'А знаешь, в чём секрет хорошего удара? Ты его не видишь.'),
];
const L1_END = [
  L('spidey', 'Туман тянется к старой киностудии «Бек Пикчерз». Квентин Бек, мастер спецэффектов. Ну конечно.'),
  L('myst', 'Браво! Антракт окончен. Акт второй — киностудия, где рождаются кошмары!'),
];
const L2_START = [
  L('narr', 'Заброшенный павильон. Пыльные декорации, прожекторы и слишком много теней.'),
  L('spidey', 'Прямо как на съёмках моего любимого ужастика. Только тут нет кнопки «пауза».'),
];
const L2_S1 = [
  L('fcat', 'Паук! Ты пришёл за мной!'),
  L('spidey', 'Фелиция! Ты цела? Как ты выбралась?'),
  L('fcat', 'Иди ко мне... ближе... ещё ближе...'),
  L('narr', 'Её глаза вспыхивают ядовито-зелёным.'),
  L('spidey', 'Это не она. Но ударить её... я не смогу. Даже фальшивую.'),
];
const L2_FCAT_END = [
  L('narr', 'Иллюзия рассыпается зелёными искрами.'),
  L('spidey', 'Бек играет на моих чувствах. Это уже личное.'),
  L('myst', 'Какая драма! Какие эмоции! Критики будут в восторге!'),
];
const L2_S2 = [
  L('myst', 'А теперь — звезда прошлого сезона! Встречайте!'),
  L('goblin', 'ХА-ХА-ХА! Скучал по мне, Паук?'),
  L('spidey', 'Норман сидит в «Рейвенкрофте». А ты просто голограмма с хорошей озвучкой.'),
  L('goblin', 'Голограмма, которая бьёт по-настоящему!'),
];
const L2_END = [
  L('narr', 'Призрак Гоблина тает в воздухе, как дым от задутой свечи.'),
  L('catv', 'Паучок... я в зеркалах. Здесь так холодно. Везде моё отражение, но меня нигде нет...'),
  L('spidey', 'Зеркальный лабиринт. Держись, котёнок. Осталось чуть-чуть.'),
];
const L3_START = [
  L('narr', 'Бесконечный зал зеркал. Отражения двигаются чуть позже, чем нужно.'),
  L('myst', 'Акт третий! Здесь не всё то, чем кажется. Даже пол у тебя под ногами!'),
];
const L3_S2 = [
  L('myst', 'Знаешь, что самое страшное в зеркалах? В них видно, кто ты на самом деле.'),
  L('spidey', 'Вижу парня, который очень хочет постучать тебе по аквариуму.'),
];
const L3_S3 = [
  L('cat', 'Паук! Я здесь! Генераторы держат купол. Разбей их!'),
  L('spidey', 'Вижу тебя! Ты даже в стеклянном пузыре выглядишь потрясающе.'),
  L('cat', 'Флиртовать будешь потом. Сейчас работай кулаками!'),
];
const RESCUE = [
  L('narr', 'Купол трескается и осыпается дождём зелёного стекла.'),
  L('cat', 'Ты пришёл. Через туман, дроны и пол-Бродвея. Ради меня.'),
  L('spidey', 'Ради тебя я бы прошёл через весь Бродвей. Даже через мюзиклы.'),
  L('cat', 'Смешной. А я ведь до сих пор не знаю, как тебя зовут.'),
  L('spidey', 'После этого шоу скажу. Обещаю.'),
  L('cat', 'Ловлю на слове, паучок.'),
  L('narr', 'Она касается его щеки через маску. Всего на секунду.'),
  L('cat', 'Иди. Я отдышусь и догоню. У меня к этому фокуснику личный счёт.'),
  L('myst', 'ФИНАЛ! Все на сцену! Таймс-сквер ждёт главного номера!'),
];
const BOSS_INTRO = [
  L('myst', 'Добро пожаловать на главную сцену! Свет! Камера! Паника!'),
  L('spidey', 'Квентин, тебе никто не говорил, что шлем-аквариум вышел из моды лет сорок назад?'),
  L('myst', 'Смейся, пока можешь. Здесь реально только то, что я разрешу!'),
];
const MYST_P2 = [
  L('myst', 'Довольно разминки! Посмотрим, как ты дерёшься вслепую. И вверх ногами!'),
  L('spidey', 'О нет. Выключенный свет и перевёрнутый мир. Прямо как мой понедельник.'),
];
const MYST_P3 = [

// ============================================================ physics helpers
function blocksH(k) { return k.kind === 'roof' || k.kind === 'block' || (k.kind === 'barrier' && k.active); }
function moveBody(b) {
  b.wallHit = false;
  b.x += b.vx;
  for (const k of solids) {
    if (!blocksH(k)) continue;
    if (b.x < k.x + k.w && b.x + b.w > k.x && b.y < k.bot && b.y + b.h > k.top) {
      if (b.vx > 0) b.x = k.x - b.w; else if (b.vx < 0) b.x = k.x + k.w;
      b.vx = 0; b.wallHit = true;
    }
  }
  b.onGround = false;
  const prevBot = b.y + b.h;
  b.y += b.vy;
  for (const k of solids) {
    if (k.kind === 'plat') {
      if (b.vy >= 0 && prevBot <= k.top + .01 && b.y + b.h >= k.top && b.x + b.w > k.x + 2 && b.x < k.x + k.w - 2) {
        b.y = k.top - b.h; b.vy = 0; b.onGround = true; b.ground = k;
      }
      continue;
    }
    if (!blocksH(k)) continue;
    if (b.x < k.x + k.w && b.x + b.w > k.x && b.y < k.bot && b.y + b.h > k.top) {
      if (b.vy > 0) { b.y = k.top - b.h; b.vy = 0; b.onGround = true; b.ground = k; }
      else if (b.vy < 0) { b.y = k.bot; b.vy = 0; }
    }
  }
}
function solidAt(x, y) {
  for (const k of solids) if (blocksH(k) && x >= k.x && x <= k.x + k.w && y >= k.top && y <= k.bot) return k;
  return null;
}
function standAt(x, y) {
  for (const k of solids) {
    if (x < k.x || x > k.x + k.w) continue;
    if (k.kind === 'plat' && y >= k.top - 2 && y <= k.top + 14) return k;
    if ((k.kind === 'roof' || k.kind === 'block') && y >= k.top - 2 && y <= k.bot) return k;
  }
  return null;
}
function pop(x, y, text, color = '#ffd84a', size = 26) { pops.push({ x, y, text, color, size, life: 50 }); }
function burst(x, y, color, n = 10, sp = 4, grav = .15) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (.4 + Math.random() * .8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 24 + Math.random() * 16, max: 40, color, size: 2 + Math.random() * 3, grav });
  }
}
function smoke(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2.5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - .5, life: 30 + Math.random() * 20, max: 50, color: pick(['#5ff2a8', '#3fb07a', '#a58bff']), size: 8 + Math.random() * 10, grav: -.02, puff: true });
  }
}
function hurtPlayer(dmg, fromX, knock = true) {
  const p = P;
  if (p.inv > 0 || state !== 'play') return;
  p.hp -= dmg; p.inv = 80; p.hurtT = 16; stats.hits++;
  if (p.swing) p.swing = null;
  if (knock) { p.vx = Math.sign(p.x + p.w / 2 - fromX || 1) * 5; p.vy = -5; }
  shake = 8; SFX.hurt();
  burst(p.x + p.w / 2, p.y + 20, '#ff4d5e', 12, 4);
  if (p.hp <= 0) { p.hp = 0; state = 'over'; overT = 0; }
}

// ============================================================ update
function update() {
  frame++;
  if (pressed.mute) { muted = !muted; syncMute(); }
  if (fadeA > 0 && state !== 'fade') fadeA = Math.max(0, fadeA - 1 / 24);
  if (hint && hint.t > 0 && state === 'play') hint.t--;

  switch (state) {
    case 'title': {
      const jump = { '#act1': 1, '#act2': 2, '#act3': 3, '#boss': 4 }[location.hash];
      if (jump && (pressed.ok || pressed.jump)) { stats = { kos: 0, time: 0, hits: 0 }; startAct(jump); return; }
      if (menuSave && menuSave.act > 0) {
        if (pressed.ok || pressed.jump) { stats = { kos: 0, time: 0, hits: 0 }; startAct(menuSave.act); }
        else if (pressed.punch) { clearSave(); seen.clear(); stats = { kos: 0, time: 0, hits: 0 }; startAct(0); }
      } else if (pressed.ok || pressed.jump || pressed.punch) { seen.clear(); stats = { kos: 0, time: 0, hits: 0 }; startAct(0); }
      return;
    }
    case 'card':
      card.t++;
      if ((card.t > 40 && (pressed.ok || pressed.jump || pressed.punch)) || card.t > 260) { const go = card.go; card = null; go(); }
      return;
    case 'dialog': updateDialog(); updateFx(); if (CAT) animCat(); return;
    case 'cut':
      cut.t++; updateFx(); if (CAT) animCat();
      if (cut.t >= cut.dur) { const d = cut.done; cut = null; state = 'play'; d(); }
      return;
    case 'fade':
      fadeA += 1 / 24;
      if (fadeA >= 1) { fadeA = 1; const cb = fadeCb; fadeCb = null; state = 'play'; cb && cb(); }
      return;
    case 'pause': if (pressed.pause || pressed.ok) state = 'play'; return;
    case 'over':
      overT++; updateFx();
      if (overT > 40 && (pressed.ok || pressed.jump || pressed.punch)) restartCheckpoint();
      return;
    case 'win':
      overT++; updateFx();
      if (overT % 40 === 0) pops.push({ x: W / 2 + (Math.random() - .5) * 80, y: 330, text: '♥', color: '#ff5a7a', size: 28, life: 50 });
      if (overT > 90 && (pressed.ok || pressed.jump)) { clearSave(); menuSave = null; state = 'title'; scene = null; }
      return;
  }
  if (pressed.pause) { state = 'pause'; return; }

  stats.time++;
  updatePlayer();
  updateEnemies();
  updateWebs();
  updateBullets();
  updateOrbs();
  updateBombs();
  if (G) updateGoblin();
  if (M) updateMyst();
  if (CAT) updateCat();
  updateHazards();
  updatePickups();
  updateFx();
  updateCamera();
  if (scene === 'lvl') checkProgress();
  if (scene === 'date') checkDate();
}

function restartCheckpoint() {
  if (scene === 'lvl') { startLevel(lvlIdx, checkpoint); state = 'play'; showHint('Контрольная точка. Зачисти участок снова', 240); }
  else if (scene === 'boss') {
    startBoss(bossPhaseCk);
    say([L('myst', pick(['Бис! Бис! Зрители требуют повтора!', 'Второй дубль, паучок! Мотор!', 'Смерть на сцене — это только спецэффект. Ещё раз!']))], () => {});
  }
}

function updateDialog() {
  const d = dialog, ln = d.lines[d.i];
  if (d.ch < ln.t.length) { d.ch += 1.3; if (frame % 3 === 0) SFX.blip(); }
  if (pressed.ok || pressed.jump || pressed.punch) {
    if (d.ch < ln.t.length) d.ch = ln.t.length;
    else {
      d.i++; d.ch = 0;
      if (d.i >= d.lines.length) { dialog = null; state = 'play'; d.done && d.done(); }
    }
  }
}

    ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
    ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-10, -1, -6, -10, 0, -4); ctx.bezierCurveTo(6, -10, 10, -1, 0, 6);
  ctx.fillStyle = full ? '#e02a3c' : '#2a2352'; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  if (!P || scene === 'date') { if (hint && hint.t > 0 && state === 'play') drawHint(); return; }
  ctx.fillStyle = 'rgba(8,6,22,.7)'; ctx.fillRect(12, 12, 200, 44);
  for (let i = 0; i < P.max; i++) heart(30 + i * 29, 28, 1.4, i < P.hp);
  ctx.font = `12px ${F_UI}`; ctx.fillStyle = '#cfc7f2'; ctx.fillText(`НОКАУТЫ: ${stats.kos}`, 22, 50);
  if (scene === 'lvl') {
    const n = enemies.filter(e => !e.dead && e.sec === secIdx).length;
    const S = lvl.sections[secIdx];
    ctx.fillStyle = 'rgba(8,6,22,.7)'; ctx.fillRect(W - 262, 12, 250, 44);
    ctx.font = `11px ${F_DISP}`; ctx.fillStyle = MIST;
    ctx.fillText(`${ACTS[act].num} · УЧАСТОК ${secIdx + 1}/${lvl.sections.length}`, W - 250, 29);
    ctx.font = `12px ${F_UI}`; ctx.fillStyle = n ? '#ffd0d6' : '#b8ffd8';
    const txt = S.boss && !S.bossDone ? (G ? 'ПОБЕДИ ПРИЗРАКА ГОБЛИНА' : 'ВПЕРЁД, В ПАВИЛЬОН →')
      : n ? `ОСТАЛОСЬ ВРАГОВ: ${n}` : lvl.exitOpen ? 'ПУТЬ СВОБОДЕН →' : 'УЧАСТОК ЗАЧИЩЕН';
    ctx.fillText(txt, W - 250, 47);
  }
  const boss = G ? { n: 'ПРИЗРАК ГОБЛИНА', hp: G.hp, max: G.max, c: '#a58bff', f: G.flash } : M ? { n: 'МИСТЕРИО', hp: M.hp, max: M.max, c: '#4fdc92', f: M.flash } : null;
  if (boss) {
    const bw = 340, bx = W / 2 - bw / 2 - (scene === 'lvl' ? 30 : 0);
    ctx.fillStyle = 'rgba(8,6,22,.75)'; ctx.fillRect(bx - 10, 62, bw + 20, 38);
    ctx.font = `12px ${F_DISP}`; ctx.fillStyle = boss.c; ctx.textAlign = 'center';
    ctx.fillText(boss.n + (M ? ` · ФАЗА ${M.phase}` : ''), bx + bw / 2, 78); ctx.textAlign = 'left';
    ctx.fillStyle = '#2a2352'; ctx.fillRect(bx, 84, bw, 9);
    ctx.fillStyle = boss.f > 0 ? '#ffffff' : boss.c; ctx.fillRect(bx, 84, bw * boss.hp / boss.max, 9);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(bx, 84, bw, 9);
    if (M) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(bx + bw / 3 - 1, 84, 2, 9); ctx.fillRect(bx + bw * 2 / 3 - 1, 84, 2, 9); }
  }
  if (hint && hint.t > 0 && state === 'play') drawHint();
}
function drawHint() {
  ctx.globalAlpha = Math.min(1, hint.t / 30);
  ctx.font = `20px ${F_TALK}`;
  const tw = Math.min(W - 60, ctx.measureText(hint.text).width);
  const y = (G || M) ? 108 : 66;
  ctx.fillStyle = '#ffd84a'; ctx.fillRect(W / 2 - tw / 2 - 14, y, tw + 28, 32);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(W / 2 - tw / 2 - 14, y, tw + 28, 32);
  ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(hint.text, W / 2, y + 17, W - 60);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
}
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function drawPortrait(who, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const face = WHO[who].face || who;
  if (face === 'spidey') spideyHead();
  else if (face === 'goblin') { ctx.translate(2, 2); goblinHead(false, true); }
  else if (face === 'myst') { ctx.scale(.8, .8); mystHead(0, 0); }
  else if (face === 'cat') { ctx.translate(1, -2); catHead(); if (who === 'fcat') { ctx.fillStyle = MIST; ctx.beginPath(); ctx.ellipse(6, -3, 2.4, 1.4, 0, 0, Math.PI * 2); ctx.fill(); } }
  ctx.restore();
}
function drawDialog() {
  const d = dialog, ln = d.lines[d.i], who = WHO[ln.s];
  const bx = 24, by = H - 150, bw = W - 48, bh = 128;
  const narr = ln.s === 'narr';
  const accent = ln.s === 'cat' || ln.s === 'catv' ? '#ff5a7a' : ln.s === 'myst' || ln.s === 'fcat' ? MIST : '#8a4fd6';
  ctx.fillStyle = accent; ctx.fillRect(bx + 6, by + 6, bw, bh);
  ctx.fillStyle = narr ? '#ffd84a' : '#fffbe8'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(bx, by, bw, bh);
  let tx = bx + 22;
  if (!narr) {
    const px = bx + 14, py = by + 14, ps = 100;
    ctx.fillStyle = who.bg; ctx.fillRect(px, py, ps, ps);
    ctx.save(); ctx.beginPath(); ctx.rect(px, py, ps, ps); ctx.clip();
    if (ln.s === 'cat' || ln.s === 'catv') { ctx.fillStyle = 'rgba(255,90,122,.18)'; for (let i = 0; i < 6; i++) ctx.fillRect(px + i * 20, py, 8, ps); }
    if (ln.s === 'myst' || ln.s === 'fcat') { ctx.fillStyle = 'rgba(95,242,168,.12)'; for (let i = 0; i < 5; i++) circle(px + 20 + i * 18, py + 80 - (i % 2) * 20, 16); }
    drawPortrait(ln.s, px + ps / 2, py + ps / 2 + 8, 3.6);
    ctx.restore();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(px, py, ps, ps);
    tx = px + ps + 20;
    ctx.font = `14px ${F_DISP}`;
    const nw = ctx.measureText(who.name).width;
    ctx.fillStyle = who.bg; ctx.fillRect(tx - 6, by - 16, nw + 20, 28);
    ctx.strokeStyle = '#000'; ctx.strokeRect(tx - 6, by - 16, nw + 20, 28);
    ctx.fillStyle = who.fg; ctx.fillText(who.name, tx + 4, by + 4);
  } else {
    ctx.font = `13px ${F_DISP}`; ctx.fillStyle = '#111';
    ctx.fillText(scene === 'date' ? 'ТЕМ ВРЕМЕНЕМ...' : 'ТЕМ ВРЕМЕНЕМ...', tx, by + 26);
  }
  ctx.font = `24px ${F_TALK}`; ctx.fillStyle = '#111';
  const shown = ln.t.slice(0, Math.floor(d.ch));
  const lines = wrap(ln.t, bx + bw - tx - 30);
  let used = 0;
  lines.forEach((l, i) => { const part = shown.slice(used, used + l.length); used += l.length + 1; ctx.fillText(part, tx, by + (narr ? 58 : 40) + i * 29); });
  if (d.ch >= ln.t.length && frame % 40 < 26) {
    ctx.fillStyle = '#e02a3c';
    ctx.beginPath(); ctx.moveTo(bx + bw - 30, by + bh - 26); ctx.lineTo(bx + bw - 16, by + bh - 18); ctx.lineTo(bx + bw - 30, by + bh - 10); ctx.fill();
  }
}
function overlay(title, sub, color = '#ffd84a') {
  ctx.fillStyle = 'rgba(6,4,18,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `46px ${F_DISP}`; ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
  ctx.strokeText(title, W / 2, H / 2 - 20); ctx.fillStyle = color; ctx.fillText(title, W / 2, H / 2 - 20);

}
function drawCard() {
  ctx.fillStyle = '#07051a'; ctx.fillRect(0, 0, W, H);
  // stage curtains
  const open = clamp(card.t / 50, 0, 1);
  const cw = lerp(W / 2, 90, open);
  for (const side of [0, 1]) {
    const x0 = side ? W - cw : 0;
    const g = ctx.createLinearGradient(x0, 0, x0 + cw, 0);
    g.addColorStop(0, '#4a0f22'); g.addColorStop(.5, '#7a1a34'); g.addColorStop(1, '#4a0f22');
    ctx.fillStyle = g; ctx.fillRect(x0, 0, cw, H);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let x = x0 + 10; x < x0 + cw; x += 26) ctx.fillRect(x, 0, 6, H);
  }
  ctx.fillStyle = '#c9a13b'; ctx.fillRect(0, 0, W, 16);
  ctx.globalAlpha = open;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `22px ${F_DISP}`; ctx.fillStyle = MIST; ctx.fillText(card.num, W / 2, H / 2 - 50);
  ctx.font = `38px ${F_DISP}`; ctx.lineWidth = 8; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
  ctx.strokeText(card.title, W / 2, H / 2 + 6); ctx.fillStyle = '#ffd84a'; ctx.fillText(card.title, W / 2, H / 2 + 6, W - 220);
  ctx.font = `20px ${F_TALK}`; ctx.fillStyle = '#cfc7f2';
  ctx.fillText('МИСТЕРИО ПРЕДСТАВЛЯЕТ', W / 2, H / 2 + 60);
  if (card.t > 40 && frame % 60 < 40) { ctx.font = `14px ${F_DISP}`; ctx.fillStyle = '#efe9ff'; ctx.fillText(COARSE ? 'КОСНИСЬ ЭКРАНА' : 'ENTER', W / 2, H - 60); }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
}
function drawWin() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);

  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 1;

  ctx.font = `20px ${F_TALK}`; ctx.fillStyle = '#efe9ff';
  const sec = Math.round(stats.time / 60);
  ctx.fillText(`Время: ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}  ·  Нокауты: ${stats.kos}  ·  Пропущено ударов: ${stats.hits}`, W / 2, 98);
  ctx.fillStyle = '#ff9ab0'; ctx.fillText('Украдено сердец: 1', W / 2, 126);
  if (overT > 90) { ctx.font = `18px ${F_TALK}`; ctx.fillStyle = MIST; ctx.fillText(COARSE ? 'Коснись экрана — в главное меню' : 'Enter — в главное меню', W / 2, 470); }

function drawTitle() {
  // roof with the couple

  if (frame % 60 < 42) {

    let t;
    if (menuSave && menuSave.act > 0) t = COARSE ? `ПРЫЖОК — ПРОДОЛЖИТЬ (${ACTS[menuSave.act].num}) · УДАР — ЗАНОВО` : `ENTER — ПРОДОЛЖИТЬ (${ACTS[menuSave.act].num}) · J — НОВАЯ ИГРА`;
    else t = COARSE ? 'КОСНИСЬ ЭКРАНА, ЧТОБЫ НАЧАТЬ' : 'НАЖМИ ENTER, ЧТОБЫ НАЧАТЬ';

}
function drawFade() { if (fadeA > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeA})`; ctx.fillRect(0, 0, W, H); } }

// ============================================================ loop
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    update();
    for (const k in pressed) pressed[k] = false;
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
if (document.fonts && document.fonts.load) ['20px Neucha', '20px "Rubik Mono One"', '20px Rubik'].forEach(f => document.fonts.load(f, 'АБВ').catch(() => {}));
requestAnimationFrame(loop);
})();
